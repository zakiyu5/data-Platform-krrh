{% extends "base.html" %}
{% block title %}Upload · KRRH{% endblock %}
{% block content %}
<h1>Upload dataset</h1>
<p class="text-muted">Supported: XLSX, XLS, CSV. The system will profile, map and scan the file.</p>
<form method="post" enctype="multipart/form-data" class="card p-4">
  <div class="mb-3">
    <label class="form-label">Select file</label>
    <input type="file" name="file" class="form-control" accept=".xlsx,.xls,.csv" required>
  </div>
  <button class="btn btn-primary" type="submit">Upload &amp; Analyse</button>
</form>
{% endblock %}
