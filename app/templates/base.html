<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}KRRH Platform{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">🏥 KRRH Data &amp; Analytics</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('main.index') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('datasets.upload') }}">Upload</a>
      <a class="nav-link" href="{{ url_for('datasets.list_datasets') }}">Datasets</a>
    </div>
  </div>
</nav>
<div class="container mb-5">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-warning">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<footer class="text-center text-muted py-4 small">
  KRRH Data &amp; Analytics Intelligence Platform · Prototype v1
</footer>
</body>
</html>
